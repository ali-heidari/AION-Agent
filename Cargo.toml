[package]
name = "aion-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
aion-rlt = {  git = "https://github.com/ali-heidari/aion-rlt" }
aion-transporter = { git = "https://github.com/ali-heidari/aion-transporter" }
aion-math = { git = "https://github.com/ali-heidari/aion-math" }
log = "0.4.28"
tokio = { version = "1.48.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
env_logger = "0.11.8"
config = "0.15.18"
sysinfo = "0.37.2"
anyhow = "1.0.100"
csv = "1.4.0"
lazy_static = "1.5.0"
rand = "0.8.0"
local-ip-address = "0.6.5"
