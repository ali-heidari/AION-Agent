upstream agents {
    server 192.168.1.60:8123;
    server 192.168.1.61:8123;
    server 192.168.1.62:8123;
    server 192.168.1.63:8123;
    server 192.168.1.64:8123;
    server 192.168.1.65:8123;
    server 192.168.1.66:8123;
    server 192.168.1.67:8123;
    server 192.168.1.68:8123;
    server 192.168.1.69:8123;
}

server {
    listen 80;

    location / {
        proxy_pass http://agents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
