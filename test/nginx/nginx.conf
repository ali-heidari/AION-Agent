upstream agents {
    server 192.168.1.70:8123;
    server 192.168.1.71:8123;
    server 192.168.1.72:8123;
    server 192.168.1.73:8123;
    server 192.168.1.74:8123;
    server 192.168.1.75:8123;
    server 192.168.1.76:8123;
    server 192.168.1.77:8123;
    server 192.168.1.78:8123;
    server 192.168.1.79:8123;
}

server {
    listen 80;

    location / {
        proxy_pass http://agents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
