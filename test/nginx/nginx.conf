upstream agents {
    server 192.168.100.70:8123;
    server 192.168.100.71:8123;
    server 192.168.100.72:8123;
    server 192.168.100.73:8123;
    server 192.168.100.74:8123;
    server 192.168.100.75:8123;
    server 192.168.100.76:8123;
    server 192.168.100.77:8123;
    server 192.168.100.78:8123;
    server 192.168.100.79:8123;
100

server {
    listen 80;

    location / {
        proxy_pass http://agents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
