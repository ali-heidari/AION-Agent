global
    daemon
    maxconn 1024

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option httplog

frontend agents_front
    bind *:80
    default_backend agents

backend agents
    balance roundrobin
    option httpchk GET /
    server agent-70 192.168.100.70:8123 check
    server agent-71 192.168.100.71:8123 check
    server agent-72 192.168.100.72:8123 check
    server agent-73 192.168.100.73:8123 check
    server agent-74 192.168.100.74:8123 check
    server agent-75 192.168.100.75:8123 check
    server agent-76 192.168.100.76:8123 check
    server agent-77 192.168.100.77:8123 check
    server agent-78 192.168.100.78:8123 check
    server agent-79 192.168.100.79:8123 check

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
