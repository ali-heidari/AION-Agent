global
    daemon
    maxconn 1024

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option httplog

frontend agents_front
    bind *:80
    default_backend agents

backend agents
    balance roundrobin
    option httpchk GET /
    server agent-60 192.168.1.60:8123 check
    server agent-61 192.168.1.61:8123 check
    server agent-62 192.168.1.62:8123 check
    server agent-63 192.168.1.63:8123 check
    server agent-64 192.168.1.64:8123 check
    server agent-65 192.168.1.65:8123 check
    server agent-66 192.168.1.66:8123 check
    server agent-67 192.168.1.67:8123 check
    server agent-68 192.168.1.68:8123 check
    server agent-69 192.168.1.69:8123 check

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
