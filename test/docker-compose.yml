name: aixker-no_agent

x-mock: &mock
  build:
    context: ..
    dockerfile: test/dockerfile
  mem_limit: 128m
  cpus: 1.0

services:
  mock-70:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.70

  mock-71:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.71

  mock-72:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.72

  mock-73:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.73

  mock-74:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.74

  mock-75:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.75

  mock-76:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.76

  mock-77:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.77

  mock-78:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.78

  mock-79:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.79


  haproxy:
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.80

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.81

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.82

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:80"
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./kong/kong.yml:/kong.yml:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.100.83

networks:
  mymacvlan:
    external: true
