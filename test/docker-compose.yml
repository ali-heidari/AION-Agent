name: aixker-no_agent

x-mock: &mock
  image: python:3-alpine
  command: sh -c "python3 /mock.py & python3 -m http.server 8123 --bind 0.0.0.0"
  mem_limit: 128m
  cpus: 1.0
  volumes:
    - ../agent/scripts/mock.py:/mock.py:ro

services:
  mock-70:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.70

  mock-71:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.71

  mock-72:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.72

  mock-73:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.73

  mock-74:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.74

  mock-75:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.75

  mock-76:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.76

  mock-77:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.77

  mock-78:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.78

  mock-79:
    <<: *mock
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.79


  haproxy:
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.80

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      mymacvlan:
        ipv4_address: 192.168.1.81

networks:
  mymacvlan:
    external: true
