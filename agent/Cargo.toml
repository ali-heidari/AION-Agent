[package]
name = "aixker-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
aixker-rlt = { git = "https://github.com/ali-heidari/aixker-rlt" }
aion-transporter = { git = "https://github.com/ali-heidari/aion-transporter" }
aion-math = { git = "https://github.com/ali-heidari/aion-math" }
log = "0.4.28"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "time", "signal","process"] }
env_logger = "0.11.8"
config = "0.15.18"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.37.2"
anyhow = "1.0.100"
csv = "1.4.0"
lazy_static = "1.5.0"
rand = "0.8.0"
local-ip-address = "0.6.5"
aya = { git = "https://github.com/aya-rs/aya" }
aya-log = { git = "https://github.com/aya-rs/aya" }
nix = { version = "0.30.1", features = ["user", "net", "fs"] }
mac_address = "1.1.8"
