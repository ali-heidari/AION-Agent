global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # cAdvisor — per-container CPU, memory, network, and filesystem metrics.
  - job_name: cadvisor
    static_configs:
      - targets:
          - "cadvisor:8080"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
